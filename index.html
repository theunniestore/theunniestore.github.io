<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de prueba</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a5f, #2d6a8f);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .check {
      font-size: 56px;
      margin-bottom: 16px;
    }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { font-size: 16px; line-height: 1.5; opacity: 0.9; }
    .fecha {
      margin-top: 24px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>¡La página está en línea!</h1>
    <p>Si estás viendo esto, la publicación con GitHub Pages funcionó correctamente.</p>
    <p class="fecha" id="fecha"></p>
  </div>
  <script>
    document.getElementById("fecha").textContent =
      "Visto el " + new Date().toLocaleString("es-CL");
  </script>
</body>
</html>
